services:
  postgres:
    image: postgres:16-alpine
    container_name: identity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/identity
      JWT_ISSUER: identity-service
      JWT_AUDIENCE: backend-services
      JWT_KEY_ID: key-1
      JWT_ACCESS_TOKEN_TTL_SECONDS: 3600
      JWT_REFRESH_TOKEN_TTL_SECONDS: 2592000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
